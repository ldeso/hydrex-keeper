name: check

on:
  schedule:
    - cron: "0 12 * * 5" # Fridays at 12:00 UTC, after the weekly vote
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      # Builds the config from config.env.example, with the repository variables named there in place of its values. A
      # setting neither gives is reported as not set in repository-variables.env.
      - env:
          VARS: ${{ toJSON(vars) }}
        run: |
          {
            cat config.env.example
            sed -n 's/^\([A-Z_]*\)=.*/\1/p' config.env.example |
              jq -Rr --argjson vars "$VARS" '. as $name | $vars[$name] // empty | "\($name)=\(@sh)"'
          } >repository-variables.env
      - run: sh/check.sh
        env:
          HYDREX_CONFIG: repository-variables.env
